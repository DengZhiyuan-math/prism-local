<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>prism-local</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/vendor/codemirror.css">
<link rel="stylesheet" href="/static/vendor/dialog.css">
<link rel="stylesheet" href="/static/vendor/show-hint.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <button id="btn-sidebar" class="tiny" title="Show/hide the Files sidebar (⌘B)">☰</button>
  <div class="brand"><span class="logo">∂</span> <span id="projname">prism-local</span></div>
  <div class="actions">
    <div class="split-btn">
      <button id="btn-compile" class="primary" title="Save all and compile (⌘↵)">▶ Compile</button>
      <select id="build-mode" title="Build mode">
        <option value="draft">Draft (continue on errors)</option>
        <option value="strict">Strict (stop at first error)</option>
        <option value="check">Check</option>
      </select>
    </div>
    <label class="toggle" title="Compile automatically after saving"><input type="checkbox" id="auto-compile"> Auto-compile on save</label>
    <span id="build-status" class="status">idle</span>
  </div>
  <div class="actions right">
    <button id="btn-popout" title="Open the PDF in a separate tab (stays in sync)">⧉ PDF</button>
    <button id="btn-chat" title="Show/hide the Claude panel (⌘L sends the selection)">✦ Claude</button>
    <button id="btn-diff" title="git diff of the manuscript">Diff</button>
    <button id="btn-theme" title="Toggle light/dark">◐</button>
  </div>
</header>

<main id="layout">
  <aside id="sidebar">
    <section>
      <h3>Files</h3>
      <ul id="tree"></ul>
    </section>
    <section class="grow">
      <h3>Outline <button id="btn-refresh-outline" class="tiny" title="Refresh">↻</button></h3>
      <ul id="outline"></ul>
    </section>
  </aside>
  <div class="gutter" data-resize="sidebar" id="sidebar-gutter"></div>

  <section id="editor-pane">
    <div id="tabs"></div>
    <div id="toolbar">
      <select id="insert" title="Insert environment"><option value="">Insert…</option></select>
      <button id="btn-save" title="Save (⌘S)">Save</button>
      <button id="btn-forward" title="Show this line in the PDF (⌘J)">→ PDF</button>
      <span class="hint">Double-click PDF to jump to source · ⌘F search · Ctrl-Space complete</span>
    </div>
    <div id="banner" hidden></div>
    <div id="editor"></div>
    <div id="empty-editor">Select a file on the left.</div>
  </section>
  <div class="gutter" data-resize="pdf"></div>

  <section id="pdf-pane">
    <div id="pdf-toolbar">
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit width">Fit</button>
      <span id="page-label"></span>
      <a id="pdf-popout" href="/viewer" title="Open the PDF in a separate tab (stays in sync)">⧉ Pop out</a>
    </div>
    <div id="pdf-scroll"><div id="pdf-pages"></div><div id="pdf-empty">No PDF yet — press Compile.</div></div>
  </section>
  <div class="gutter" data-resize="chat" id="chat-gutter"></div>

  <aside id="chat">
    <div id="chat-head">
      <b>✦ Claude</b>
      <select id="chat-mode" title="Edit: may change files (you review a diff and can undo). Ask: read-only.">
        <option value="edit">Edit</option>
        <option value="ask">Ask (read-only)</option>
      </select>
      <button id="chat-new" class="tiny" title="Start a new conversation">New chat</button>
    </div>
    <div id="quota"></div>
    <div id="chat-log"></div>
    <div id="chat-foot">
      <label id="chat-ctx-label" title="Send the open file, cursor line and selection with the message">
        <input type="checkbox" id="chat-ctx" checked> <span id="chat-ctx-text">Attach editor context</span>
      </label>
      <textarea id="chat-input" rows="3" placeholder="Ask Claude to explain, check or revise… (↵ send, ⇧↵ newline)"></textarea>
      <div class="chat-actions">
        <span id="chat-status" class="status"></span>
        <button id="chat-send" class="primary">Send</button>
      </div>
    </div>
  </aside>
</main>

<footer id="panel" class="collapsed">
  <div id="panel-tabs">
    <button data-panel="problems" class="active">Problems <span id="problem-count" class="badge"></span></button>
    <button data-panel="output">Output</button>
    <button data-panel="diff">Diff</button>
    <button id="panel-toggle" title="Show/hide panel">▴</button>
  </div>
  <div id="panel-body">
    <ul id="problems" class="panel-view"></ul>
    <pre id="output" class="panel-view" hidden></pre>
    <pre id="diff" class="panel-view" hidden></pre>
  </div>
</footer>

<script src="/static/vendor/codemirror.js"></script>
<script src="/static/vendor/stex.js"></script>
<script src="/static/vendor/markdown.js"></script>
<script src="/static/vendor/searchcursor.js"></script>
<script src="/static/vendor/dialog.js"></script>
<script src="/static/vendor/search.js"></script>
<script src="/static/vendor/matchbrackets.js"></script>
<script src="/static/vendor/closebrackets.js"></script>
<script src="/static/vendor/active-line.js"></script>
<script src="/static/vendor/show-hint.js"></script>
<script src="/static/vendor/pdf.js"></script>
<script src="/static/common.js"></script>
<script src="/static/pdfview.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
